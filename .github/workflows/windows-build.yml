name: Windows Build

permissions:
  contents: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    env:
      RARESTAGE_SIGNING_CERTIFICATE: ${{ secrets.RARESTAGE_SIGNING_CERTIFICATE }}
      RARESTAGE_SIGNING_PASSWORD: ${{ secrets.RARESTAGE_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target RareStage RareStageConsole RareStageProtocolTests RareStagePhraseTests --parallel
      - name: Verify Windows identity metadata
        shell: pwsh
        run: |
          foreach ($binary in @("build/Release/RareStage.exe", "build/Release/RareStageConsole.exe")) {
            $version = (Get-Item $binary).VersionInfo
            if ($version.CompanyName -ne "AntNetwork, L.L.C." -or $version.ProductVersion -ne "0.25.0") {
              throw "$binary is missing the expected publisher or v0.25.0 product metadata"
            }
          }
          $consoleImage = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("build/Release/RareStageConsole.exe"))
          foreach ($forbidden in @("CreateProcessW", "WinExec", "powershell.exe", "cmd.exe", "URLDownloadToFile")) {
            if ($consoleImage.Contains($forbidden)) {
              throw "RareStageConsole.exe contains forbidden launcher/import marker: $forbidden"
            }
          }
      - name: Sign release executables when certificate is configured
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RARESTAGE_SIGNING_CERTIFICATE)) {
            Write-Host "Signing certificate is not configured; publishing checksummed unsigned binaries."
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "RareStage-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:RARESTAGE_SIGNING_CERTIFICATE))
          try {
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $signTool) { throw "signtool.exe was not found" }
            foreach ($binary in @("build/Release/RareStage.exe", "build/Release/RareStageConsole.exe")) {
              & $signTool sign /fd SHA256 /f $certificatePath /p $env:RARESTAGE_SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $binary
              if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $binary" }
              & $signTool verify /pa /all $binary
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $binary" }
            }
          } finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }
      - name: Control protocol tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Phrase conductor render and bank geometry contracts
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--phrase-test" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Phrase choreography render failed: $($process.ExitCode)" }
          if (@(Import-Csv RareStage-phrase-validation/phrases.csv).Count -ne 24 -or @(Import-Csv RareStage-phrase-validation/bank-bridges.csv).Count -ne 216) { throw "Incomplete phrase render coverage" }
      - name: Kinetic playground programs and native handoffs
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--play-test" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Playground rendering failed: $($process.ExitCode)" }
          if (@(Import-Csv RareStage-play-validation/patterns.csv).Count -ne 420) { throw "Expected 140 programs in three aspects" }
          if (@(Import-Csv RareStage-play-validation/program-blends.csv).Count -ne 1260) { throw "Expected every ordered within-scene program change" }
          if (@(Import-Csv RareStage-play-validation/bridges.csv).Count -ne 936) { throw "Expected 104 playground/graphic native edges with nine program combinations" }
      - name: Graphic composition, identity and handoff captures
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--graphic-test" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Graphic composition capture failed: $($process.ExitCode)" }
          if (@(Import-Csv RareStage-graphic-validation/visual-checks.csv).Count -ne 444) { throw "Incomplete graphic visual fixtures" }
      - name: Shared wall patterns across object materials
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--material-test" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Shared material patterns failed: $($process.ExitCode)" }
          if (@(Import-Csv RareStage-material-validation/material-patterns.csv).Count -ne 288) { throw "Expected six scenes, sixteen banks and three aspect ratios" }
      - name: Performance choreography and long-set contract
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--performance-self-test" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Performance choreography contract failed: $($process.ExitCode)" }
      - name: Audio classifier self-test
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--audio-self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content RareStage-audio-self-test.log -ErrorAction SilentlyContinue
            throw "Audio classifier self-test failed with exit code $($process.ExitCode)"
          }
      - name: Motion timing and reference capture
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--motion-self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Motion timing self-test failed with exit code $($process.ExitCode)"
          }
      - name: Smart Director 2 prediction contract
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--director-self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path RareStage-director2-reference.csv)) {
            throw "Smart Director 2 prediction contract failed with exit code $($process.ExitCode)"
          }
          $rows = @(Import-Csv RareStage-director2-reference.csv)
          if (@($rows | Where-Object predicted_drop -eq "1").Count -eq 0 -or
              @($rows | Where-Object { [double]$_.adaptive_density -lt 0.70 -or [double]$_.adaptive_density -gt 1.14 }).Count -ne 0) {
            throw "Director 2 forecast or adaptive density trace is invalid"
          }
      - name: Adaptive Show Grammar contract
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--production-self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path RareStage-production-pack-reference.csv)) {
            throw "Adaptive Show Grammar contract failed with exit code $($process.ExitCode)"
          }
          $rows = @(Import-Csv RareStage-production-pack-reference.csv)
          if ($rows.Count -ne 80 -or @($rows | Group-Object duty).Count -ne 5 -or
              @($rows | Group-Object mastering).Count -ne 4 -or @($rows | Group-Object layout).Count -ne 4 -or
              @($rows | Where-Object { [double]$_.brightness -lt 0.65 -or [double]$_.brightness -gt 1.0 -or [double]$_.visible_area -lt 0.5 }).Count -ne 0) {
            throw "Production duty, mastering, layout, or safety bounds are invalid"
          }
      - name: Club Loop Engine contract
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--club-loop-self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path RareStage-club-loop-reference.csv) -or -not (Test-Path RareStage-choreography-reference.csv)) {
            throw "Club Loop Engine contract failed with exit code $($process.ExitCode)"
          }
          $rows = @(Import-Csv RareStage-club-loop-reference.csv)
          if ($rows.Count -ne 36 -or @($rows | Group-Object category).Count -ne 4 -or
              @($rows | Group-Object tempo_anchor).Count -ne 2 -or
              @($rows | Where-Object { $_.scene_scope -eq "environment" } | Group-Object world).Count -lt 4 -or
              @($rows | Group-Object identity_mode).Count -ne 4 -or
              @($rows | Where-Object { $_.choreography -ne "establish>roll>resolve>release" }).Count -ne 0 -or
              @($rows | Where-Object { $_.autonomous_motion -ne "continuous" -or ([int]$_.loop_beats -ne 64 -and [int]$_.loop_beats -ne 96) }).Count -ne 0) {
            throw "Club categories, identity choreography, environmental worlds, tempo anchors, or loop contracts are invalid"
          }
          $choreography = @(Import-Csv RareStage-choreography-reference.csv)
          if (@($choreography | Group-Object refresh_hz).Count -ne 3 -or
              @($choreography | Where-Object { [double]$_.formation_weight -lt 0 -or [double]$_.formation_weight -gt 1 }).Count -ne 0) {
            throw "Showbrain stanza progression is invalid"
          }
      - name: Performance world and identity regression
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--performance-test" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Performance world validation failed: $($process.ExitCode)" }
      - name: Full-field ensemble composition
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--ensemble-test" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Ensemble composition validation failed: $($process.ExitCode)" }
      - name: Scene routes and all ordered handoffs
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--professional-test" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Scene route/continuity validation failed: $($process.ExitCode)" }
          $pairs = @(Import-Csv RareStage-professional-validation/all-pairs.csv)
          if ($pairs.Count -ne 1406) { throw "All 1406 ordered scene pairs must be covered" }
      - name: Shader self-test
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content RareStage-self-test.log -ErrorAction SilentlyContinue
            throw "Shader self-test failed with exit code $($process.ExitCode)"
          }
      - name: Prepare portable shader bytecode
        shell: pwsh
        run: |
          foreach ($flag in @("--shader-cache-test", "--prepare-shaders")) {
            $process = Start-Process build/Release/RareStage.exe -ArgumentList $flag -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Shader cache check failed: $flag" }
          }
      - name: Startup smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/Release/assets | Out-Null
          Copy-Item assets/rare-logo.png build/Release/assets/rare-logo.png
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--startup-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content build/Release/RareStage-startup.log -ErrorAction SilentlyContinue
            throw "Startup smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Console startup smoke test
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStageConsole.exe -ArgumentList "--startup-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Console startup smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Calibration trace replay contract
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStageConsole.exe -ArgumentList "--trace-replay-self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path tests/audio_trace_contract.analysis.txt)) {
            throw "Calibration trace replay contract failed with exit code $($process.ExitCode)"
          }
      - name: Rehearsal recorder contract
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStageConsole.exe -ArgumentList "--rehearsal-self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path RareStage-rehearsal-contract.csv) -or -not (Test-Path RareStage-rehearsal-contract.md)) {
            throw "Rehearsal recorder contract failed with exit code $($process.ExitCode)"
          }
          $rows = @(Import-Csv RareStage-rehearsal-contract.csv)
          if ($rows.Count -ne 6 -or @($rows | Where-Object event -eq "smart_capture").Count -ne 2) {
            throw "Rehearsal contract did not preserve deterministic capture events"
          }
      - name: Console launches Stage soak test
        shell: pwsh
        run: |
          try {
            $console = Start-Process build/Release/RareStageConsole.exe -ArgumentList "--launch-stage-soak-test" -Wait -PassThru
            if ($console.ExitCode -ne 0) {
              throw "Console-owned Stage launch soak test failed with exit code $($console.ExitCode)"
            }
          } finally {
            Get-Process RareStage -ErrorAction SilentlyContinue | ForEach-Object {
              Stop-Process -Id $_.Id -Force
              $_.WaitForExit()
            }
          }
      - name: Deterministic world capture and GPU budget manifest
        shell: pwsh
        run: |
          Remove-Item RareStage-reference-captures.csv -Force -ErrorAction SilentlyContinue
          Remove-Item RareStage-reference-captures -Recurse -Force -ErrorAction SilentlyContinue
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--reference-capture-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content build/Release/RareStage-startup.log -ErrorAction SilentlyContinue
            throw "Reference capture test failed with exit code $($process.ExitCode)"
          }
          $captures = @(Get-ChildItem RareStage-reference-captures -Filter *.png)
          $manifest = @(Import-Csv RareStage-reference-captures.csv)
          if ($captures.Count -ne 96 -or $manifest.Count -ne 96 -or @($manifest | Where-Object status -ne "captured").Count -ne 0 -or
              @($manifest | Where-Object { [double]$_.cue_density -lt 0.55 -or [double]$_.cue_density -gt 1.35 }).Count -ne 0) {
            throw "Expected 96 clean reference captures and complete GPU budget rows"
          }
      - name: Living Worlds visual artifact regression
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--visual-regression-test" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Visual artifact regression failed with exit code $($process.ExitCode)" }
          $frames = @(Import-Csv RareStage-visual-validation/frames.csv)
          if ($frames.Count -ne 57856) { throw "Expected 57856 phase, identity and instrument frames" }
      - name: Continuous scene choreography regression
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--choreography-test --no-preview" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Scene choreography regression failed with exit code $($process.ExitCode)" }
          $frames = @(Import-Csv RareStage-choreography-validation/morph-frames.csv)
          if ($frames.Count -ne 13068) { throw "Expected 13068 frames across 27 scene pairs and four motion paths" }
      - name: Stage lighting and display contracts
        shell: pwsh
        run: |
          $stage = Start-Process build/Release/RareStage.exe -ArgumentList "--stage-lighting-test" -WindowStyle Hidden -Wait -PassThru
          if ($stage.ExitCode -ne 0) { throw "Stage lighting/display validation failed: $($stage.ExitCode)" }
          $console = Start-Process build/Release/RareStageConsole.exe -ArgumentList "--screen-ui-test" -WindowStyle Hidden -Wait -PassThru
          if ($console.ExitCode -ne 0) { throw "Screen controls validation failed: $($console.ExitCode)" }
      - name: Render catalog previews
        shell: pwsh
        run: ./tools/build_catalog_previews.ps1
      - name: Package portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/RareStage/assets | Out-Null
          Copy-Item build/Release/RareStage.exe dist/RareStage/RareStage.exe
          Copy-Item build/Release/RareStageConsole.exe dist/RareStage/RareStageConsole.exe
          Copy-Item assets/rare-logo.png dist/RareStage/assets/rare-logo.png
          Copy-Item assets/catalog dist/RareStage/assets/catalog -Recurse
          Copy-Item build/Release/assets/shaders dist/RareStage/assets/shaders -Recurse
          Copy-Item docs dist/RareStage/docs -Recurse
          Copy-Item README.md,SECURITY.md,THIRD_PARTY_NOTICES.md dist/RareStage/
          $binarySums = @(
            "$(Get-FileHash dist/RareStage/RareStage.exe -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  RareStage.exe",
            "$(Get-FileHash dist/RareStage/RareStageConsole.exe -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  RareStageConsole.exe"
          )
          $binarySums | Set-Content dist/RareStage/RareStage-BINARY-SHA256SUMS.txt
          $provenance = [ordered]@{
            product = "RareStage"
            version = "0.25.0"
            commit = $env:GITHUB_SHA
            workflow_run = $env:GITHUB_RUN_ID
            spout2_commit = "c2bcc12147711d12ace7d5f08e869d774d840f8a"
            authenticode_signed = -not [string]::IsNullOrWhiteSpace($env:RARESTAGE_SIGNING_CERTIFICATE)
          }
          $provenance | ConvertTo-Json | Set-Content dist/RareStage/RareStage-build-provenance.json
          Copy-Item dist/RareStage/RareStage-build-provenance.json RareStage-build-provenance.json
          Compress-Archive -Path dist/RareStage -DestinationPath RareStage-windows-x64.zip -Force
          @(
            "$(Get-FileHash RareStage-windows-x64.zip -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  RareStage-windows-x64.zip",
            "$(Get-FileHash dist/RareStage/RareStage.exe -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  RareStage.exe",
            "$(Get-FileHash dist/RareStage/RareStageConsole.exe -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  RareStageConsole.exe"
          ) | Set-Content RareStage-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RareStage-windows-x64
          path: |
            RareStage-windows-x64.zip
            RareStage-SHA256SUMS.txt
            RareStage-build-provenance.json
            RareStage-motion-reference.csv
            RareStage-world-reference.csv
            RareStage-director2-reference.csv
            RareStage-production-pack-reference.csv
            RareStage-club-loop-reference.csv
            RareStage-choreography-reference.csv
            RareStage-reference-captures.csv
            RareStage-reference-captures/*.png
            RareStage-visual-validation/frames.csv
            RareStage-visual-validation/*.png
            RareStage-choreography-validation/morph-frames.csv
            RareStage-choreography-validation/*.png
            RareStage-material-validation/*.csv
            RareStage-graphic-validation/visual-checks.csv
            RareStage-graphic-validation/stills/*.png
            RareStage-play-validation/*.csv
            RareStage-play-validation/scene-*.png
            RareStage-phrase-validation/*.csv
            RareStage-phrase-validation/scene-*.png
            build/RareStage-phrase-contracts.csv
            build/RareStage-entry-matching.csv
            RareStage-catalog-ui.bmp
            RareStage-ensemble-validation/*.csv
            RareStage-ensemble-validation/scene-*.png
            RareStage-performance-validation/*.csv
            RareStage-performance-validation/scene-*.png
            RareStage-performance-contracts.csv
            RareStage-professional-validation/*.csv
            RareStage-lighting-validation/*.csv
            RareStage-lighting-validation/*.png
            RareStage-screens-ui.bmp
            RareStage-rehearsal-contract.csv
            RareStage-rehearsal-contract.md
            tests/audio_trace_contract.analysis.txt
      - name: Publish v0.25.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v0.25.0 --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload v0.25.0 RareStage-windows-x64.zip RareStage-SHA256SUMS.txt RareStage-build-provenance.json --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create v0.25.0 RareStage-windows-x64.zip RareStage-SHA256SUMS.txt RareStage-build-provenance.json --title "RareStage 0.25.0 — Graphic Worlds" --generate-notes --repo $env:GITHUB_REPOSITORY
          }
