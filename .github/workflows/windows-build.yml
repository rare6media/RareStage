name: Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake -S . -B build -A x64

      - name: Build RareStage
        run: cmake --build build --config Release --parallel

      - name: Test embedded shaders
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path RareStage-self-test.log) { Get-Content RareStage-self-test.log }
            throw "Shader self-test failed with exit code $($process.ExitCode)."
          }

      - name: Test native startup
        shell: pwsh
        run: |
          $process = Start-Process build/Release/RareStage.exe -ArgumentList "--startup-test" -Wait -PassThru
          if (Test-Path build/Release/RareStage-startup.log) { Get-Content build/Release/RareStage-startup.log }
          if ($process.ExitCode -ne 0) { throw "Native startup test failed with exit code $($process.ExitCode)." }

      - name: Package portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/RareStage | Out-Null
          Copy-Item build/Release/RareStage.exe dist/RareStage/
          Copy-Item README.md dist/RareStage/
          Compress-Archive -Path dist/RareStage/* -DestinationPath dist/RareStage-windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RareStage-windows-x64
          path: dist/RareStage-windows-x64.zip
          if-no-files-found: error

      - name: Publish automatic build release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/RareStage-windows-x64.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "RareStage Build ${{ github.run_number }}" --generate-notes
